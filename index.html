<!doctype html>
<html lang="sv" data-theme="dark">
<head>
<meta charset="utf-8">
<title>20 Cycle Check — Process Observation</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="format-detection" content="telephone=no">
<meta name="theme-color" content="#ffffff">
<style>
  :root{
    --bg:#f7f7f9; --paper:#ffffff; --ink:#0f172a; --muted:#6b7280; --line:#e5e7eb; --accent:#2563eb;
    --radius:10px; --tap:40px; --fs:clamp(13px,2.2vw,15px); --fs-sm:clamp(11px,1.9vw,13px);
    --blue-600:#2563eb; --blue-500:#3b82f6; --blue-400:#60a5fa; --blue-300:#93c5fd;
  }
  html[data-theme="dark"]{
    --bg:#0b1020;--paper:#111827;--ink:#f8fafc;--muted:#94a3b8;--line:#334155;--accent:#60a5fa
  }
  *{box-sizing:border-box}
  html,body{height:100%;margin:0}
  body{font-family:system-ui,-apple-system,Segoe UI,Inter,Arial,sans-serif;font-size:var(--fs);background:var(--bg);color:var(--ink)}
  .app{min-height:100%;padding:8px}

  .menubar{
    display:flex;flex-wrap:wrap;align-items:center;gap:8px;
    background:var(--paper);border:1px solid var(--line);border-radius:var(--radius);
    padding:6px 10px;margin-bottom:8px
  }
  .logo{font-weight:800;font-size:16px;white-space:nowrap;margin-right:auto}
  .menu-actions{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
  .langbtn{
    display:inline-flex;align-items:center;gap:8px;
    padding:6px 10px;border:1px solid var(--line);border-radius:999px;background:var(--paper);color:var(--ink);font-size:var(--fs-sm);cursor:pointer
  }
  .flag{font-size:16px;line-height:1}
  .btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:var(--tap);padding:8px 12px;border-radius:8px;border:1px solid var(--line);background:var(--paper);color:inherit;cursor:pointer;touch-action:manipulation}
  .btn:disabled{opacity:.45;cursor:not-allowed}
  .btn.primary{background:var(--blue-600);color:#fff;border-color:#1d4ed8}
  .btn.secondary{background:var(--paper);border-color:var(--line)}
  .btn.danger{background:#dc2626;border-color:#ef4444;color:#fff;font-weight:800}
  .btn.small{min-height:34px;padding:6px 10px;font-size:var(--fs-sm)}

  .top-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
  .card{background:var(--paper);border:1px solid var(--line);border-radius:var(--radius)}
  .pad{padding:8px}
  label{font-size:var(--fs-sm);color:var(--muted)}
  input[type=text],input[type=number],input[type=time],select{width:100%;min-height:42px;padding:8px 10px;border:1px solid var(--line);border-radius:8px;background:var(--paper);color:var(--ink);font-size:16px}

  .lang-card .row2{display:grid;grid-template-columns:1.2fr 1.2fr 130px 120px 150px;gap:8px}
  .study-details{margin-top:8px;border-top:1px solid var(--line);padding-top:8px}
  .study-details summary{cursor:pointer;color:var(--muted);font-weight:700}
  .details-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:8px}

  .timer-card .controls{display:grid;grid-template-columns:minmax(160px,1fr) minmax(130px,.75fr) minmax(92px,.45fr);gap:8px;align-items:center}
  .timer-card .controls > *{min-width:0}
  .timer-card .mid{display:flex;justify-content:center}
  .timer{font-weight:800;font-size:18px;background:#0a0;color:#fff;padding:10px 12px;border-radius:8px;text-align:center;min-width:0;width:100%}

  .wrap{display:grid;grid-template-columns:1.2fr 0.8fr;gap:8px;margin-top:8px}
  .chart-card{display:flex;flex-direction:column}
  .chart-header{display:flex;flex-direction:column;gap:8px;border-bottom:1px solid var(--line);padding-bottom:10px}
  .chart-title{margin:0;font-size:18px;font-weight:700;color:var(--ink)}
  .kpis{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
  .pill{padding:8px 10px;border:1px solid var(--line);border-radius:9px;background:var(--paper);font-size:var(--fs-sm)}
  .pill b{display:block;margin-top:2px;font-size:15px}
  .chart-wrap{padding:6px}
  canvas{width:100%;height:360px;display:block}

  .list-head,.list-row{display:grid;grid-template-columns:48px 92px 110px 1fr 40px;gap:8px;align-items:center}
  .list-head{position:sticky;top:0;background:var(--paper);border-bottom:1px solid var(--line);padding:8px;font-weight:700;z-index:1}
  .list{max-height:460px;overflow:auto;border-top:1px solid var(--line);padding:8px}
  .list-row{
    padding:10px;background:var(--paper);border:1px solid var(--line);border-radius:10px;margin-bottom:8px;box-shadow:0 1px 2px rgba(0,0,0,.04);
  }
  .list-row.selected{outline:2px solid #60a5fa}
  .list-row.abnormal{border-left:5px solid #dc2626}
  .list-row.ct-green{border-left:6px solid #16a34a;background:color-mix(in srgb,#16a34a 9%,var(--paper))}
  .list-row.ct-orange{border-left:6px solid #f59e0b;background:color-mix(in srgb,#f59e0b 10%,var(--paper))}
  .list-row.ct-red{border-left:6px solid #dc2626;background:color-mix(in srgb,#dc2626 10%,var(--paper))}
  .badge{display:inline-block;background:#e2e8f0;color:#334155;padding:4px 8px;border-radius:999px;font-size:var(--fs-sm);font-weight:600}
  .active-tag{display:none;margin-left:5px;padding:3px 6px;border-radius:999px;background:#2563eb;color:#fff;font-size:10px;font-weight:800}
  textarea{width:100%;min-height:42px;border:1px solid var(--line);border-radius:8px;padding:7px;background:var(--paper);color:var(--ink);font:inherit;font-size:16px}
  .flag-btn{min-height:40px;border:1px solid var(--line);border-radius:8px;background:var(--paper);color:var(--muted);font-weight:700;cursor:pointer}
  .flag-btn.active{background:#fee2e2;color:#991b1b;border-color:#fca5a5}
  .piece-toggle,.reason-toggle{display:flex;gap:5px;flex-wrap:wrap}
  .choice{min-height:38px;padding:6px 10px;border:1px solid var(--line);border-radius:8px;background:var(--paper);color:var(--ink);font-weight:700;cursor:pointer}
  .choice.active{background:var(--blue-600);border-color:var(--blue-600);color:#fff}
  .reason-toggle{margin-bottom:6px}.reason-toggle .choice{font-size:12px;font-weight:600}
  .shortcut-help{text-align:center;color:var(--muted);font-size:12px;margin-top:6px}
  .delete-btn{cursor:pointer;border:none;background:none;font-size:18px;line-height:1;color:#dc2626}
  .delete-btn:hover{color:#b91c1c}

  @media (max-width:980px){
    .wrap{grid-template-columns:1fr}
    canvas{height:300px}
    .top-grid{grid-template-columns:1fr}
  }
  @media (max-width:640px){
    .app{padding:6px;padding-bottom:116px}
    .menubar{align-items:flex-start}
    .menu-actions{width:100%;display:grid;grid-template-columns:repeat(4,1fr)}
    .menu-actions .btn,.menu-actions .langbtn{padding:6px 4px;font-size:11px;min-width:0}
    .lang-card .row2,.details-grid{grid-template-columns:1fr 1fr}
    .kpis{grid-template-columns:repeat(2,1fr)}
    .list-head{display:none}
    .list{max-height:none;padding:8px}
    .list-row{grid-template-columns:repeat(2,minmax(0,1fr));grid-template-areas:
      "cycle time"
      "pieces pieces"
      "problems problems"
      "delete delete"}
    .list-row .cycle{grid-area:cycle}
    .list-row .time{grid-area:time}
    .list-row .pieces-cell{grid-area:pieces}
    .list-row .problems{grid-area:problems}
    .list-row .delete-cell{grid-area:delete;text-align:right}
    .list-row.active-cycle{order:-1}
    .list-row.active-cycle .active-tag{display:inline-block}
    .timer-card{position:fixed;z-index:20;left:6px;right:6px;bottom:max(6px,env(safe-area-inset-bottom));box-shadow:0 12px 30px rgba(0,0,0,.28)}
    .timer-card .controls{grid-template-columns:1fr .72fr .55fr;gap:6px}
    .timer-card .btn{min-height:58px;font-size:20px!important}
    .timer{font-size:20px;padding:16px 8px}
    canvas{height:260px}
  }
  .toast{position:fixed;left:50%;bottom:90px;transform:translateX(-50%);z-index:40;background:#0f172a;color:#fff;padding:10px 14px;border-radius:10px;box-shadow:0 8px 24px rgba(0,0,0,.3)}
  .hidden{display:none!important}
  .capacity-summary{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-top:2px}.capacity-summary .pill{border-left:4px solid var(--blue-500)}
  .modal-backdrop{position:fixed;inset:0;z-index:60;background:rgba(2,6,23,.72);display:flex;align-items:center;justify-content:center;padding:14px}.modal{width:min(620px,100%);max-height:92vh;overflow:auto;background:var(--paper);border:1px solid var(--line);border-radius:14px;box-shadow:0 24px 70px rgba(0,0,0,.45);padding:16px}.modal-head{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:12px}.modal-head h2{font-size:19px;margin:0}.modal-close{font-size:24px;line-height:1;border:0;background:none;color:var(--ink);cursor:pointer}.process-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.modal-actions{display:flex;justify-content:flex-end;gap:8px;margin-top:14px}.calc-preview{margin-top:12px;padding:10px;border-radius:10px;background:color-mix(in srgb,var(--blue-500) 10%,var(--paper));border:1px solid color-mix(in srgb,var(--blue-500) 35%,var(--line));font-size:var(--fs-sm)}
  @media(max-width:640px){.capacity-summary{grid-template-columns:1fr}.process-grid{grid-template-columns:1fr}.modal{padding:14px}.menu-actions{grid-template-columns:repeat(5,1fr)}}
</style>
</head>
<body>
<div class="app">

  <!-- Menyrad -->
  <div class="menubar">
    <div class="logo">20 Cycle Check</div>
    <div class="menu-actions">
      <button id="btnLang" class="langbtn"><span class="flag">🇸🇪</span><span id="langLabel">SV</span></button>
      <button id="btnProcessData" class="btn small">Processdata</button>
      <button id="btnExport" class="btn small">Exportera</button>
      <button id="btnReport" class="btn small">Rapport (PDF)</button>
      <button id="btnReset" class="btn small danger">Nollställ</button>
    </div>
  </div>

  <!-- Process/Datum/TAKT  |  Start/Timer/Stop -->
  <div class="top-grid">
    <div class="card pad lang-card">
      <div class="row2">
        <div>
          <label id="lblProcess">PROCESS</label>
          <input id="process" type="text" placeholder="Ange processnamn…">
        </div>
        <div>
          <label id="lblSubprocess">UNDERPROCESS</label>
          <input id="subprocess" type="text" list="subprocessOptions" placeholder="Välj eller skriv…" autocomplete="off">
          <datalist id="subprocessOptions"></datalist>
        </div>
        <div>
          <label id="lblDate">DATE</label>
          <input id="date" type="text" placeholder="yyyy-mm-dd">
        </div>
        <div>
          <label id="lblStandard">STANDARD WORK CT</label>
          <input id="standard" type="number" min="0" step="0.1" placeholder="sek">
          <div id="colorRule" style="font-size:11px;color:var(--muted);margin-top:4px">Grön ≤ standard · Orange ≤ +20 % · Röd &gt; +20 %</div>
        </div>
        <div>
          <label id="lblTakt">TAKTTID</label>
          <div style="display:flex;gap:5px"><input id="takt" type="number" min="0" step="0.1" placeholder="sek"><button id="btnCalcTakt" class="btn small" type="button">Beräkna</button></div>
        </div>
      </div>
      <details class="study-details">
        <summary id="detailsSummary">Mätdetaljer (valfritt)</summary>
        <div class="details-grid">
          <div>
            <label id="lblProduct">ARTIKEL / VARIANT</label>
            <input id="product" type="text" placeholder="Artikel, familj eller variant">
          </div>
          <div>
            <label id="lblBoundary">MÄTGRÄNS</label>
            <input id="boundary" type="text" placeholder="Startpunkt → slutpunkt">
          </div>
        </div>
      </details>
    </div>

    <div class="card pad timer-card">
      <div class="controls">
        <div class="start"><button id="btnToggle" class="btn primary" style="width:100%;font-size:16px;padding:12px 14px">Start</button></div>
        <div class="mid"><div class="timer" id="timerDisp">00:00.00</div></div>
        <div class="stop"><button id="btnStop" class="btn secondary" style="width:100%" disabled>Stoppa</button></div>
      </div>
      <div id="shortcutHelp" class="shortcut-help">Tips: tryck mellanslag (Space) för nästa cykel</div>
    </div>
  </div>

  <!-- Diagram + KPI + Lista -->
  <div class="wrap">
    <div class="card chart-card">
      <div class="chart-header pad">
        <h3 id="resultsTitle" class="chart-title">Resultat</h3>
        <div class="kpis">
          <div class="pill"><span id="kpiProgressLabel"></span> <b id="kpiProgress">0 / 20</b></div>
          <div class="pill"><span id="kpiAvgLabel"></span> <b id="kpiAvg">00:00.00</b></div>
          <div class="pill"><span id="kpiBrctLabel"></span> <b id="kpiBrct">–</b></div>
          <div class="pill"><span id="kpiDistLabel"></span> <b id="kpiDist">–</b></div>
          <div class="pill"><span id="kpiOneLabel"></span> <b id="kpiOne">–</b></div>
          <div class="pill"><span id="kpiTwoLabel"></span> <b id="kpiTwo">–</b></div>
        </div>
        <div id="capacitySummary" class="capacity-summary hidden"><div class="pill"><span id="capCyclesLabel">Cykler/skift</span><b id="capCycles">–</b></div><div class="pill"><span id="capProductsLabel">Produkter/skift</span><b id="capProducts">–</b></div><div class="pill"><span id="capTargetLabel">Rimligt mål</span><b id="capTarget">–</b></div></div>
      </div>
      <div class="chart-wrap">
        <canvas id="chart" height="360"></canvas>
      </div>
    </div>

    <div class="card pad">
      <div class="list-head">
        <div id="thCycle">CYCLE</div>
        <div id="thTime">TIME(S)</div>
        <div id="thPieces">RUTOR</div>
        <div id="thProblems">OBSERVED PROBLEMS</div>
        <div> </div>
      </div>
      <div id="list" class="list"></div>
    </div>
  </div>
</div>
<div id="processModal" class="modal-backdrop hidden" role="dialog" aria-modal="true"><div class="modal"><div class="modal-head"><h2 id="processModalTitle">Processdata och skiftmål</h2><button id="closeProcessModal" class="modal-close">×</button></div><div class="process-grid">
<div><label id="lblShiftType">AKTUELLT SKIFT</label><select id="shiftType"><option value="1">1:a skift</option><option value="2">2:a skift</option></select></div><div><label id="lblProductsCycle">PRODUKTER PER CYKEL / MIX</label><input id="productsPerCycle" type="number" min="0.01" step="0.01" inputmode="decimal" placeholder="t.ex. 1,5"></div><div><label id="lblStartTime">STARTTID</label><input id="startTime" type="time"></div><div><label id="lblEndTime">SLUTTID</label><input id="endTime" type="time"></div><div><label id="lblPlannedStop">PLANERAD STOPPTID (MIN)</label><input id="plannedStopMinutes" type="number" min="0" step="1" inputmode="decimal" placeholder="Uppstart, städ, rast"></div><div><label id="lblSetups">PLANERAT ANTAL STÄLL</label><input id="setupsPerShift" type="number" min="0" step="1" inputmode="numeric" placeholder="0"></div><div><label id="lblSetupMinutes">PLANERAD STÄLLTID PER STÄLL (MIN)</label><input id="setupMinutes" type="number" min="0" step="0.1" inputmode="decimal" placeholder="0"></div></div><div id="processPreview" class="calc-preview"></div><div class="modal-actions"><button id="cancelProcessData" class="btn secondary">Avbryt</button><button id="saveProcessData" class="btn primary">Spara och beräkna</button></div></div></div>
<div id="toast" class="toast hidden" role="status" aria-live="polite"></div>

<!-- jsPDF för PDF-export -->
<script src="https://cdn.jsdelivr.net/npm/jspdf@2.5.1/dist/jspdf.umd.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/exceljs@4.4.0/dist/exceljs.min.js"></script>

<script>
/* ===== i18n ===== */
const L={
  sv:{PROCESS:"PROCESS",SUBPROCESS:"UNDERPROCESS",DATE:"DATUM",PH_PROCESS:"Ange processnamn…",PH_SUBPROCESS:"Välj eller skriv…",PH_DATE:"yyyy-mm-dd",
      STANDARD:"STANDARD WORK CT",TAKT:"TAKTTID",PH_TAKT:"sek",STANDARD_LABEL:"Standard:",TAKT_LABEL:"Takt:",
      TOGGLE_START:"Start",TOGGLE_LAP:"Nästa cykel",STOP:"Stoppa",RESET:"Nollställ",EXPORT:"Excel",REPORT:"PDF",SHORTCUT:"Tips: tryck mellanslag (Space) för nästa cykel",COLOR_RULE:"Grön ≤ standard · Orange ≤ +20 % · Röd > +20 %",
      RESULTS_TITLE:"Resultat",
      KPI_PROGRESS:"Cykler",KPI_AVG:"Ø CT (medel)",KPI_BRCT:"BRCT (5 snabbaste)",KPI_DIST:"Störningsgrad",KPI_ONE:"Ø CT · 1 ruta",KPI_TWO:"Ø CT · 2 rutor",
      KPI_AVG_SHORT:"Ø CT:",KPI_BRCT_SHORT:"BRCT:",CSV_DECIMAL:",",
      LONGEST:"Längsta CT:", SHORTEST:"Kortaste CT:", DISTURBANCE:"D %:",
      PRODUCT:"ARTIKEL / VARIANT",BOUNDARY:"MÄTGRÄNS",DETAILS:"Mätdetaljer (valfritt)",PH_PRODUCT:"Artikel, familj eller variant",PH_BOUNDARY:"Startpunkt → slutpunkt",
      CYCLE:"CYKEL",TIME:"TID",PIECES:"RUTOR",PROBLEMS:"AVVIKELSE / KOMMENTAR",ACTIVE:"AKTIV",CURRENT:"PÅGÅR",NOTE_PLACEHOLDER:"Kommentar till pågående cykel",THEME:"Tema",QUALITY:"Kvalitetsproblem / kontroll",CHANGEOVER:"Ställtid",MACHINE:"Maskinfel",OTHER:"Annat",
      COMPLETE:"20 cykler klara",DELETED:"Cykel raderad",UNDO:"Ångra",NO_DATA:"Inga cykler att exportera.",
      CALC_TAKT_BTN:"Beräkna", /* NEW */
      PROMPT_VOLUME:"Ange årsvolym (antal enheter/år):", /* NEW */
      PROMPT_HOURS:"Ange arbetstid per vecka (timmar) — 78 är standard:", /* NEW */
      ALERT_BAD_INPUT:"Ogiltiga värden. Försök igen." /* NEW */
  },
  en:{PROCESS:"PROCESS",SUBPROCESS:"SUBPROCESS",DATE:"DATE",PH_PROCESS:"Enter process name…",PH_SUBPROCESS:"Choose or type…",PH_DATE:"yyyy-mm-dd",
      STANDARD:"STANDARD WORK CT",TAKT:"TAKT TIME",PH_TAKT:"sec",STANDARD_LABEL:"Standard:",TAKT_LABEL:"Takt:",
      TOGGLE_START:"Start",TOGGLE_LAP:"Next cycle",STOP:"Stop",RESET:"Reset",EXPORT:"Excel",REPORT:"PDF",SHORTCUT:"Tip: press Space for the next cycle",COLOR_RULE:"Green ≤ standard · Orange ≤ +20% · Red > +20%",
      RESULTS_TITLE:"Results",
      KPI_PROGRESS:"Cycles",KPI_AVG:"Ø CT (mean)",KPI_BRCT:"BRCT (5 fastest)",KPI_DIST:"Disturbance rate",KPI_ONE:"Ø CT · 1 panel",KPI_TWO:"Ø CT · 2 panels",
      KPI_AVG_SHORT:"Ø CT:",KPI_BRCT_SHORT:"BRCT:",CSV_DECIMAL:".",
      LONGEST:"Longest CT:", SHORTEST:"Shortest CT:", DISTURBANCE:"D %:",
      PRODUCT:"ARTICLE / VARIANT",BOUNDARY:"MEASUREMENT BOUNDARY",DETAILS:"Study details (optional)",PH_PRODUCT:"Article, family or variant",PH_BOUNDARY:"Start point → end point",
      CYCLE:"CYCLE",TIME:"TIME",PIECES:"PANELS",PROBLEMS:"DEVIATION / COMMENT",ACTIVE:"ACTIVE",CURRENT:"RUNNING",NOTE_PLACEHOLDER:"Comment on current cycle",THEME:"Theme",QUALITY:"Quality problem / inspection",CHANGEOVER:"Changeover",MACHINE:"Machine fault",OTHER:"Other",
      COMPLETE:"20 cycles completed",DELETED:"Cycle deleted",UNDO:"Undo",NO_DATA:"No cycles to export.",
      CALC_TAKT_BTN:"Calculate", /* NEW */
      PROMPT_VOLUME:"Enter annual volume (units/year):", /* NEW */
      PROMPT_HOURS:"Enter working hours per week — 78 is default:", /* NEW */
      ALERT_BAD_INPUT:"Invalid values. Please try again." /* NEW */
  }
};
let lang='sv';
const $=s=>document.querySelector(s);

/* ===== Helpers ===== */
function pad(n,w=2){return String(n).padStart(w,'0')}
function formatMs(ms){const cs=Math.round(ms/10),m=Math.floor(cs/6000),s=Math.floor((cs%6000)/100),c=cs%100; return `${pad(m)}:${pad(s)}.${pad(c)}`}
function formatSecondsForCSV(ms){const secs=(ms/1000).toFixed(2); return lang==='en'?secs:secs.replace('.',L[lang].CSV_DECIMAL)}

/* ===== State ===== */
let laps=[];
let running=false, tStart=0, tick=null;
let pendingCycle={note:'',pieces:1,reason:''};
let processData={shiftType:'1',startTime:'06:18',endTime:'14:42',plannedStopMinutes:0,setupsPerShift:0,setupMinutes:0,productsPerCycle:1};
let selectedIndex=-1;
const STORAGE_KEY='cycle-check-state-v8';
const LEGACY_STORAGE_KEY='cycle-check-state-v6';
const SUBPROCESS_HISTORY_KEY='cycle-check-subprocesses-v1';
const theme='dark';
let wakeLock=null, deletedLap=null, toastTimer=null;

let rafId=null;

/* ===== UI refs ===== */
const processInput=$('#process'), subprocessInput=$('#subprocess'), dateInput=$('#date'), standardInput=$('#standard'), taktInput=$('#takt');
const productInput=$('#product'), boundaryInput=$('#boundary');
const toggleBtn=$('#btnToggle'), stopBtn=$('#btnStop'), timerDisp=$('#timerDisp');
const chart=$('#chart');

/* ===== i18n apply ===== */
function setLangTexts(){
  $('#lblProcess').textContent=L[lang].PROCESS;
  $('#lblSubprocess').textContent=L[lang].SUBPROCESS;
  $('#lblDate').textContent=L[lang].DATE;
  $('#lblStandard').textContent=L[lang].STANDARD;
  $('#lblTakt').textContent=L[lang].TAKT;
  $('#process').placeholder=L[lang].PH_PROCESS;
  $('#subprocess').placeholder=L[lang].PH_SUBPROCESS;
  $('#date').placeholder=L[lang].PH_DATE;
  standardInput.placeholder=L[lang].PH_TAKT;
  taktInput.placeholder=L[lang].PH_TAKT;
  $('#btnProcessData').textContent=lang==='sv'?'Processdata':'Process data';
  $('#btnExport').textContent=L[lang].EXPORT;
  $('#btnReport').textContent=L[lang].REPORT;
  $('#btnReset').textContent=L[lang].RESET;
  $('#resultsTitle').textContent=L[lang].RESULTS_TITLE;
  $('#kpiProgressLabel').textContent=L[lang].KPI_PROGRESS;
  $('#kpiAvgLabel').textContent=L[lang].KPI_AVG;
  $('#kpiBrctLabel').textContent=L[lang].KPI_BRCT;
  $('#kpiDistLabel').textContent=L[lang].KPI_DIST;
  $('#kpiOneLabel').textContent=L[lang].KPI_ONE;
  $('#kpiTwoLabel').textContent=L[lang].KPI_TWO;
  $('#lblProduct').textContent=L[lang].PRODUCT;

/* ===== Timer ===== */
function startTimer(){
  if(running) return;
  running=true;
  tStart=performance.now();
  timerDisp.textContent='00:00.00';
  if(tick) clearInterval(tick);
  tick=setInterval(()=>{ timerDisp.textContent = formatMs(performance.now()-tStart); }, 50);
  toggleBtn.textContent=L[lang].TOGGLE_LAP;
  stopBtn.disabled=false;
  requestWakeLock();
  startLoop();
  renderList();
}
function lap(){
  if(!running) return;
  const now = performance.now();
  const elapsed = Math.max(10, now - tStart);
  tStart = now;
  timerDisp.textContent = '00:00.00';
  laps.push({ms: elapsed,note:pendingCycle.note,pieces:pendingCycle.pieces,reason:pendingCycle.reason});
  pendingCycle={note:'',pieces:1,reason:''};
  selectedIndex = laps.length - 1;
  if(navigator.vibrate) navigator.vibrate(25);
  if(laps.length===20) showToast(L[lang].COMPLETE);
  refreshUI();
}
function cancelCurrentTimer(){
  if(running){
    running=false;
    if(tick){ clearInterval(tick); tick=null; }
    toggleBtn.textContent=L[lang].TOGGLE_START;
  }
  timerDisp.textContent='00:00.00';
  stopBtn.disabled=true;
  pendingCycle={note:'',pieces:1,reason:''};
  renderList();
  stopLoop();
  releaseWakeLock();
}
function toggle(){ running ? lap() : startTimer(); }
toggleBtn.addEventListener('click', toggle);
stopBtn.addEventListener('click', cancelCurrentTimer);

async function requestWakeLock(){
  try{ if('wakeLock' in navigator) wakeLock=await navigator.wakeLock.request('screen'); }catch(e){}
}
async function releaseWakeLock(){
  try{ if(wakeLock) await wakeLock.release(); }catch(e){} finally{ wakeLock=null; }
}
document.addEventListener('visibilitychange',()=>{ if(document.visibilityState==='visible' && running) requestWakeLock(); });

/* ===== Tangentbord ===== */
window.addEventListener('keydown', e=>{
  const ae=document.activeElement;
  const tag=ae && ae.tagName ? ae.tagName.toUpperCase(): '';
  if(e.code==='Space'){
    if(e.repeat){ e.preventDefault(); return; }
    if(tag==='TEXTAREA' || (tag==='INPUT' && (ae.type||'').toLowerCase()!=='button')) return;
    e.preventDefault();
    running ? lap() : startTimer();
  }
  if(e.key && e.key.toLowerCase()==='s' && tag!=='TEXTAREA' && tag!=='INPUT'){
    e.preventDefault();
    cancelCurrentTimer();
  }
  if(e.key==='Delete' || e.key==='Backspace'){
    if(tag==='TEXTAREA' || tag==='INPUT'){ return; }
    e.preventDefault();
    deleteSelected();
  }
});

function selectRow(ix){
  selectedIndex=ix;
  document.querySelectorAll('.list-row').forEach((r,i)=> r.classList.toggle('selected', i===ix));
}
function deleteSelected(){
  if(selectedIndex<0 || selectedIndex>=laps.length) return;
  const ix=selectedIndex;
  deletedLap={lap:laps[ix],index:ix};
  laps.splice(ix,1);
  selectedIndex=-1;
  refreshUI();
  showUndoToast();
}

function showToast(message, actionText='', action=null){
  const toast=$('#toast');
  clearTimeout(toastTimer);
  toast.innerHTML='';
  const span=document.createElement('span'); span.textContent=message; toast.appendChild(span);
  if(action){
    const btn=document.createElement('button'); btn.className='btn small'; btn.style.marginLeft='10px'; btn.textContent=actionText;
    btn.addEventListener('click',()=>{ action(); toast.classList.add('hidden'); }); toast.appendChild(btn);
  }
  toast.classList.remove('hidden');
  toastTimer=setTimeout(()=>toast.classList.add('hidden'),4500);
}
function showUndoToast(){
  showToast(L[lang].DELETED,L[lang].UNDO,()=>{
    if(!deletedLap) return;
    laps.splice(deletedLap.index,0,deletedLap.lap); deletedLap=null; refreshUI();

}

function avgMs(a){return a.length? a.reduce((x,y)=>x+y,0)/a.length:0}
function brctMs(a){ if(!a.length) return null; return avgMs([...a].sort((x,y)=>x-y).slice(0,Math.min(5,a.length))); }
function longestMs(arr){ return arr.length ? Math.max(...arr) : 0; }
function shortestMs(arr){ return arr.length ? Math.min(...arr) : 0; }
function disturbanceRate(avg, br){ return (avg>0 && br!==null) ? ((avg - br)/avg*100) : 0; }
function standardDeviation(arr){
  if(arr.length<2) return 0;
  const mean=avgMs(arr);
  return Math.sqrt(arr.reduce((sum,x)=>sum+Math.pow(x-mean,2),0)/(arr.length-1));
}
function cycleColor(ms){
  const standardMs=Number(standardInput.value||0)*1000;
  if(!standardMs) return '#3b82f6';
  if(ms<=standardMs) return '#16a34a';
  if(ms<=standardMs*1.2) return '#f59e0b';
  return '#dc2626';
}

function updateKPIs(){
  const arr=laps.map(x=>x.ms), avg=avgMs(arr), br=brctMs(arr);
  $('#kpiAvg').textContent=arr.length?formatMs(Math.round(avg)):'00:00.00';
  $('#kpiBrct').textContent=br!==null?formatMs(Math.round(br)):'–';
  $('#kpiProgress').textContent=`${laps.length} / 20${laps.length>20?' +':''}`;
  $('#kpiDist').textContent=arr.length?`${disturbanceRate(avg,br).toFixed(1)} %`:'–';
  const one=laps.filter(x=>x.pieces===1).map(x=>x.ms), two=laps.filter(x=>x.pieces===2).map(x=>x.ms);
  $('#kpiOne').textContent=one.length?`${formatMs(Math.round(avgMs(one)))} (${one.length})`:'–';
  $('#kpiTwo').textContent=two.length?`${formatMs(Math.round(avgMs(two)))} (${two.length})`:'–';
}

function shiftMinutes(start,end){if(!start||!end)return 0;const [sh,sm]=start.split(':').map(Number),[eh,em]=end.split(':').map(Number);let d=(eh*60+em)-(sh*60+sm);if(d<=0)d+=1440;return d}
function processCapacity(){const avg=avgMs(laps.map(x=>x.ms))/1000,br=brctMs(laps.map(x=>x.ms)),brSec=br?br/1000:0,std=Math.max(0,Number(standardInput.value)||0),ppc=Math.max(.01,Number(processData.productsPerCycle)||1),scheduled=shiftMinutes(processData.startTime,processData.endTime),stops=Math.max(0,Number(processData.plannedStopMinutes)||0),setups=Math.max(0,Number(processData.setupsPerShift)||0)*Math.max(0,Number(processData.setupMinutes)||0),plannedMinutes=Math.max(0,scheduled-stops-setups),seconds=plannedMinutes*60,toTarget=ct=>ct>0?Math.floor(seconds/ct*ppc):0;return{avg,brSec,std,ppc,scheduled,stops,setups,plannedMinutes,standardTarget:toTarget(std),actualTarget:toTarget(avg),reasonableTarget:toTarget(brSec)}}
function formatQty(v){return Number(v||0).toLocaleString(lang==='sv'?'sv-SE':'en-GB',{maximumFractionDigits:1})}
function updateCapacitySummary(){const x=processCapacity(),ok=laps.length&&x.plannedMinutes>0&&x.ppc>0;$('#capacitySummary').classList.toggle('hidden',!ok);$('#capCycles').textContent=ok&&x.std?formatQty(x.standardTarget):'–';$('#capProducts').textContent=ok?formatQty(x.actualTarget):'–';$('#capTarget').textContent=ok&&x.brSec?formatQty(x.reasonableTarget):'–'}
function applyProcessDataTexts(){const s=lang==='sv';$('#processModalTitle').textContent=s?'Processdata och mål för aktuellt skift':'Process data and current shift target';$('#lblShiftType').textContent=s?'AKTUELLT SKIFT':'CURRENT SHIFT';$('#lblProductsCycle').textContent=s?'PRODUKTER PER CYKEL / MIX':'PRODUCTS PER CYCLE / MIX';$('#lblStartTime').textContent=s?'STARTTID':'START TIME';$('#lblEndTime').textContent=s?'SLUTTID':'END TIME';$('#lblPlannedStop').textContent=s?'PLANERAD STOPPTID (MIN)':'PLANNED STOP TIME (MIN)';$('#lblSetups').textContent=s?'PLANERAT ANTAL STÄLL':'PLANNED CHANGEOVERS';$('#lblSetupMinutes').textContent=s?'PLANERAD STÄLLTID PER STÄLL (MIN)':'PLANNED MINUTES PER CHANGEOVER';$('#cancelProcessData').textContent=s?'Avbryt':'Cancel';$('#saveProcessData').textContent=s?'Spara och beräkna':'Save and calculate';$('#capCyclesLabel').textContent=s?'Mål enligt Standard Work CT':'Target from Standard Work CT';$('#capProductsLabel').textContent=s?'Faktiskt mål enligt Medel CT':'Actual target from Average CT';$('#capTargetLabel').textContent=s?'Rimligt mål enligt BRCT':'Reasonable target from BRCT';updateProcessPreview()}

function openProcessModal(){fillProcessModal();$('#processModal').classList.remove('hidden');$('#shiftType').focus()}function closeProcessModal(){$('#processModal').classList.add('hidden')}function saveProcessForm(){processData=readProcessForm();saveState();updateCapacitySummary();drawChart();closeProcessModal()}

/* ===== Diagram ===== */
function drawChart(){
  const dpr=window.devicePixelRatio||1;
  const c=document.getElementById('chart');
  const clientW=Math.max(1,c.clientWidth), clientH=Math.max(1,c.clientHeight);
  const W=clientW*dpr, H=clientH*dpr;
  c.width=W; c.height=H;

  const isMobile = window.innerWidth <= 640;
  const padL = (isMobile ? 40 : 64) * dpr;
  const padR = 96*dpr, padT = 16*dpr, padB = 42*dpr;
  const innerW=W-padL-padR, innerH=H-padT-padB;
  const ctx=c.getContext('2d');
  const styles=getComputedStyle(document.documentElement);
  const ink=styles.getPropertyValue('--ink').trim()||'#0f172a';
  const line=styles.getPropertyValue('--line').trim()||'#e2e8f0';
  const paper=styles.getPropertyValue('--paper').trim()||'#ffffff';
  ctx.clearRect(0,0,W,H);
  if(innerW<=0 || innerH<=0) return;

  const values = laps.map(l=>l.ms);
  if(running){
    const current = Math.max(0, performance.now()-tStart);
    values.push(current);
  }

  const maxMsTmp = values.length ? Math.max(...values,10000) : 10000;
  const maxS = Math.max(10, Math.ceil(maxMsTmp/1000/10)*10);
  const msToY = ms => padT+innerH-(ms/(maxS*1000))*innerH;

  ctx.font = `${12*dpr}px system-ui,-apple-system,Segoe UI,Inter,Arial`;
  ctx.textBaseline = 'middle';
  for (let s = 0; s <= maxS; s++) {
    const y = msToY(s * 1000);
    ctx.strokeStyle = line; ctx.lineWidth = 1 * dpr;
    ctx.beginPath(); ctx.moveTo(padL, y); ctx.lineTo(W - padR, y); ctx.stroke();
    if (s % 5 === 0) {
      ctx.strokeStyle = '#94a3b8'; ctx.lineWidth = 1.5 * dpr;
      ctx.beginPath(); ctx.moveTo(padL, y); ctx.lineTo(W - padR, y); ctx.stroke();
      const m = Math.floor(s / 60), sec = s % 60;
      ctx.fillStyle = ink;
      ctx.fillText(`${String(m).padStart(2,'0')}:${String(sec).padStart(2,'0')}`, 4*dpr, y);
    }
  }

  const n=values.length;
  if(n){
    const gap=Math.max(3*dpr, innerW/(n*20));
    const bw=Math.max(8*dpr,(innerW-gap*(n-1))/n);
    for(let i=0;i<n;i++){
      const ms=values[i];
      const x=padL+i*(bw+gap);
      const y=msToY(ms);
      const h=msToY(0)-y;
      const isCurrent=running && i===laps.length;
      ctx.fillStyle=cycleColor(ms);
      ctx.fillRect(Math.round(x),Math.round(y),Math.floor(bw),Math.max(0,Math.round(h)));
      const seconds=(ms/1000).toFixed(1);
      ctx.font=`700 ${Math.max(9,Math.min(12,bw/dpr*.32))*dpr}px system-ui,-apple-system,Segoe UI,Inter,Arial`;
      ctx.textAlign='center'; ctx.textBaseline='bottom';
      const inside=h>30*dpr;
      ctx.fillStyle=inside?'#fff':ink;
      ctx.fillText(`${seconds}s`,x+bw/2,inside?y+Math.min(h-5*dpr,18*dpr):y-3*dpr);
      ctx.fillStyle=ink; ctx.font=`${10*dpr}px system-ui,-apple-system,Segoe UI,Inter,Arial`;
      ctx.textAlign='center'; ctx.textBaseline='top';
      ctx.fillText(`${i+1}`,x+bw/2,H-padB+6*dpr);
    }
  }

  const arr=laps.map(l=>l.ms);
  const guides=[];
  if(arr.length){
    const avg=avgMs(arr);
    guides.push({ y: msToY(avg), color:'#f97316', text:`${L[lang].KPI_AVG_SHORT} ${formatMs(Math.round(avg))}`, dash:[6*dpr,4*dpr] });
    const br=brctMs(arr);
    if(br!==null){
      guides.push({ y: msToY(br), color:'#16a34a', text:`${L[lang].KPI_BRCT_SHORT} ${formatMs(Math.round(br))}`, dash:[4*dpr,3*dpr] });
    }
  }
  const standardVal=Number(standardInput.value||0);
  if(standardVal>0){
    guides.push({y:msToY(standardVal*1000),color:'#60a5fa',text:`${L[lang].STANDARD_LABEL} ${standardVal}s`,dash:[]});
  }
  const taktVal = Number(taktInput.value || 0);
  if(taktVal>0){
    guides.push({ y: msToY(taktVal*1000), color:'#a855f7', text:`${L[lang].TAKT_LABEL} ${taktVal}s`, dash:[2*dpr,3*dpr] });
  }

  guides.sort((a,b)=>a.y-b.y);
  const minSep = 16*dpr;
  for(let i=1;i<guides.length;i++){
    if(guides[i].y - guides[i-1].y < minSep){
      guides[i].y = guides[i-1].y + minSep;
    }
  }
  guides.forEach(g=>{
    g.y = Math.max(12*dpr, Math.min(padT + (H-padB-padT), g.y));
  });

  guides.forEach(g=>{
    ctx.setLineDash(g.dash||[]);
    ctx.strokeStyle=g.color; ctx.lineWidth=1.7*dpr;
    ctx.beginPath(); ctx.moveTo(padL, g.y); ctx.lineTo(W - padR, g.y); ctx.stroke();
    ctx.setLineDash([]);

    ctx.beginPath(); ctx.moveTo(W - padR, g.y); ctx.lineTo(W - padR + 6*dpr, g.y); ctx.stroke();

    const labelPadX=6*dpr, labelPadY=3*dpr;
    ctx.font = `${12*dpr}px system-ui,-apple-system,Segoe UI,Inter,Arial`;
    const textW = ctx.measureText(g.text).width;
    const boxW = textW + labelPadX*2 + 4*dpr;
    const boxH = 18*dpr;

    const bx = W - padR + 8*dpr;
    const by = g.y - boxH/2;

    ctx.fillStyle = paper;
    ctx.strokeStyle = '#cbd5e1';
    ctx.lineWidth = 1*dpr;
    roundRect(ctx, bx, by, boxW, boxH, 4*dpr, true, true);
    ctx.fillStyle = g.color;
    ctx.fillRect(bx, by, 3*dpr, boxH);

    ctx.fillStyle = ink;
    ctx.textBaseline='middle'; ctx.textAlign='left';
    ctx.fillText(g.text, bx + labelPadX + 3*dpr, g.y);
  });
}

function roundRect(ctx, x, y, w, h, r, fill, stroke) {
  if (typeof r === 'number') r = {tl:r,tr:r,br:r,bl:r};
  ctx.beginPath();
  ctx.moveTo(x + r.tl, y);
  ctx.lineTo(x + w - r.tr, y);
  ctx.quadraticCurveTo(x + w, y, x + w, y + r.tr);
  ctx.lineTo(x + w, y + h - r.br);
  ctx.quadraticCurveTo(x + w, y + h, x + w - r.br, y + h);
  ctx.lineTo(x + r.bl, y + h);
  ctx.quadraticCurveTo(x, y + h, x, y + h - r.bl);
  ctx.lineTo(x, y + r.tl);
  ctx.quadraticCurveTo(x, y, x + r.tl, y);
  if (fill) ctx.fill();
  if (stroke) ctx.stroke();
}

function loop(){
  drawChart();
  if(running) rafId = requestAnimationFrame(loop);
  else rafId = null;
}
function startLoop(){
  if(rafId==null) rafId = requestAnimationFrame(loop);

/* ===== Persistens ===== */
function saveState(){
  try{
    const payload={
      lang,
      theme,
      pendingCycle,
      laps:laps.map(l=>({ms:l.ms,note:l.note||'',pieces:l.pieces===2?2:1,reason:l.reason||''})),
      process:processInput.value||'',
      subprocess:subprocessInput.value||'',
      date:dateInput.value||'',
      standard:Number(standardInput.value)||0,
      takt:Number(taktInput.value)||0,
      product:productInput.value||'',
      boundary:boundaryInput.value||'',processData
    };
    localStorage.setItem(STORAGE_KEY, JSON.stringify(payload));
  }catch(err){ console.warn('Failed to save state', err); }
}
function loadState(){
  try{
    const raw=localStorage.getItem(STORAGE_KEY)||localStorage.getItem(LEGACY_STORAGE_KEY);
    if(!raw) return;
    const stored=JSON.parse(raw);
    if(stored && typeof stored==='object'){
      if(stored.lang && L[stored.lang]) lang=stored.lang;
      if(stored.pendingCycle && typeof stored.pendingCycle==='object'){
        pendingCycle={note:String(stored.pendingCycle.note||''),pieces:stored.pendingCycle.pieces===2?2:1,reason:String(stored.pendingCycle.reason||'')};
      }
      if(Array.isArray(stored.laps)){
        laps=stored.laps.map(item=>({ms:Number(item.ms)||0,note:item.note||'',pieces:item.pieces===2?2:1,reason:item.reason||(item.abnormal?'other':'')})).filter(item=>item.ms>0);
      }
      if(typeof stored.process==='string') processInput.value=stored.process;
      if(typeof stored.subprocess==='string') subprocessInput.value=stored.subprocess;
      if(typeof stored.date==='string') dateInput.value=stored.date;
      if(typeof stored.standard==='number') standardInput.value=stored.standard||'';
      if(typeof stored.takt==='number') taktInput.value = stored.takt || '';
      if(typeof stored.product==='string') productInput.value=stored.product;
      if(typeof stored.boundary==='string') boundaryInput.value=stored.boundary;
      if(stored.processData&&typeof stored.processData==='object')processData={...processData,...stored.processData};
    }
  }catch(err){ console.warn('Failed to load state', err); }
}

/* ===== DELNING / NEDLADDNING ===== */
function buildCSVBlob() {
  const rows=[];
  rows.push(['Process', processInput.value||'']);
  rows.push(['Subprocess', subprocessInput.value||'']);
  rows.push(['Article / variant', productInput.value||'']);
  rows.push(['Measurement boundary', boundaryInput.value||'']);
  rows.push(['Date', dateInput.value||'']);
  rows.push(['Standard Work CT (s)',Number(standardInput.value)||0]);
  rows.push(['Takt time (s)',Number(taktInput.value)||0]);
  rows.push([]);
  rows.push(['Cycle','Panels','ms','sec','Deviation type','Notes']);
  laps.forEach((lap,i)=>{
    rows.push([`${i+1}`,lap.pieces||1,Math.round(lap.ms),formatSecondsForCSV(lap.ms),lap.reason||'',(lap.note||'').replace(/\n/g,' ')]);
  });
  const csv=rows.map(r=>r.map(v=>`"${String(v??'').replace(/"/g,'""')}"`).join(';')).join('\r\n');
  return new Blob(['\ufeff',csv],{type:'text/csv;charset=utf-8;'});
}
function downloadBlob(blob, filename){
  const url=URL.createObjectURL(blob);
  const a=document.createElement('a');
  a.href=url; a.download=filename;
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
  URL.revokeObjectURL(url);
}
async function shareOrDownloadFile(blob, filename, mime, preferShare=true){
  try{
    const file = new File([blob], filename, { type: mime });
    if (preferShare && navigator.canShare && navigator.canShare({ files:[file] })) {
      await navigator.share({
        files: [file],
        title: filename,
        text: (lang==='sv' ? 'Se bifogad fil.' : 'See attached file.')
      });
      return;
    }
  }catch(e){}
  downloadBlob(blob, filename);
}

  // Draw the chart as PDF vectors so bars, guide lines and labels stay sharp at any zoom.
  const standardSec=Number(standardInput.value)||0,taktSec=Number(taktInput.value)||0;
  const plotX=chartX+16,plotY=chartY+20,plotW=116,plotH=103,legendX=plotX+plotW+5;
  const values=arr.map(ms=>ms/1000),guideValues=[avg/1000,br/1000,standardSec,taktSec].filter(v=>v>0);
  const rawMax=Math.max(10,...values,...guideValues),step=rawMax<=30?5:(rawMax<=60?10:Math.ceil(rawMax/30)*5);
  const maxSec=Math.ceil(rawMax/step)*step,yFor=s=>plotY+plotH-(s/maxSec)*plotH;
  pdf.setFont('helvetica','normal');pdf.setFontSize(6.5);pdf.setTextColor(...muted);
  for(let s=0;s<=maxSec;s+=step){const y=yFor(s);pdf.setDrawColor(224,230,238);pdf.setLineWidth(.22);pdf.setLineDashPattern([],0);pdf.line(plotX,y,plotX+plotW,y);pdf.text(`${s} s`,plotX-2,y+2,{align:'right'});}
  pdf.setDrawColor(148,163,184);pdf.setLineWidth(.35);pdf.line(plotX,plotY,plotX,plotY+plotH);pdf.line(plotX,plotY+plotH,plotX+plotW,plotY+plotH);
  const slot=plotW/laps.length,barW=Math.max(2.7,Math.min(7.2,slot*.68));
  laps.forEach((l,i)=>{const seconds=l.ms/1000,barY=yFor(seconds),barH=plotY+plotH-barY;const color=!standardSec?[37,99,235]:(seconds<=standardSec?[74,163,68]:(seconds<=standardSec*1.2?[232,166,19]:[204,58,42]));const cx=plotX+slot*(i+.5);pdf.setFillColor(...color);pdf.roundedRect(cx-barW/2,barY,barW,barH,.45,.45,'F');pdf.setFont('helvetica','bold');pdf.setFontSize(laps.length>15?5.2:6.1);const label=`${seconds.toFixed(1)} s`;if(barH>=10){pdf.setTextColor(...white);pdf.text(label,cx,barY+4.2,{align:'center'});}else{pdf.setTextColor(...navy);pdf.text(label,cx,Math.max(plotY+3,barY-1.4),{align:'center'});}pdf.setFont('helvetica','normal');pdf.setFontSize(6);pdf.setTextColor(...navy);pdf.text(String(i+1),cx,plotY+plotH+4.5,{align:'center'});});
  const guides=[
    {label:lang==='sv'?'Medel':'Average',value:avg/1000,color:[232,126,22],dash:[2,1]},
    {label:'BRCT',value:br/1000,color:[44,160,89],dash:[2,1]},
    ...(standardSec?[{label:'Standard',value:standardSec,color:[63,129,230],dash:[]}]:[]),
    ...(taktSec?[{label:lang==='sv'?'Takt':'Takt',value:taktSec,color:[145,78,229],dash:[.7,1]}]:[])
  ];
  guides.forEach(g=>{const y=yFor(g.value);pdf.setDrawColor(...g.color);pdf.setLineWidth(.65);pdf.setLineDashPattern(g.dash,0);pdf.line(plotX,y,plotX+plotW,y);});
  pdf.setLineDashPattern([],0);
  const labelItems=guides.map(g=>({...g,y:yFor(g.value)})).sort((a,b)=>a.y-b.y);
  labelItems.forEach((g,i)=>{g.ly=Math.max(plotY+3,g.y);if(i&&g.ly<labelItems[i-1].ly+8)g.ly=labelItems[i-1].ly+8;});
  if(labelItems.length&&labelItems[labelItems.length-1].ly>plotY+plotH-2){const shift=labelItems[labelItems.length-1].ly-(plotY+plotH-2);labelItems.forEach(g=>g.ly-=shift);}
  labelItems.forEach(g=>{pdf.setDrawColor(...g.color);pdf.setLineWidth(.5);pdf.line(plotX+plotW,g.y,legendX-1,g.ly);pdf.setFillColor(...g.color);pdf.roundedRect(legendX,g.ly-3.3,35,6.2,1,1,'F');pdf.setFont('helvetica','bold');pdf.setFontSize(6.3);pdf.setTextColor(...white);pdf.text(`${g.label}: ${g.value.toFixed(1)} s`,legendX+2,g.ly+.8,{maxWidth:31});});
  const tableX=190,tableY=77,tableW=W-M-tableX,rowH=5.8;
  pdf.setFillColor(...navy);pdf.roundedRect(tableX,tableY,tableW,9,2,2,'F');
  pdf.setFont('helvetica','bold');pdf.setFontSize(7.2);pdf.setTextColor(...white);
  pdf.text('#',tableX+3,tableY+5.8);pdf.text(lang==='sv'?'Rutor':'Panels',tableX+11,tableY+5.8);pdf.text(lang==='sv'?'Tid':'Time',tableX+28,tableY+5.8);pdf.text(lang==='sv'?'Avvikelse / kommentar':'Deviation / comment',tableX+48,tableY+5.8);
  laps.slice(0,20).forEach((l,i)=>{const y=tableY+9+i*rowH;const std=Number(standardInput.value||0)*1000;const color=!std?[37,99,235]:(l.ms<=std?[22,163,74]:(l.ms<=std*1.2?[245,158,11]:[220,38,38]));if(i%2===0){pdf.setFillColor(247,249,252);pdf.rect(tableX,y,tableW,rowH,'F');}pdf.setFillColor(...color);pdf.circle(tableX+4.3,y+rowH/2,1.2,'F');pdf.setFont('helvetica','normal');pdf.setFontSize(7);pdf.setTextColor(...navy);pdf.text(String(i+1),tableX+7,y+3.8);pdf.text(String(l.pieces||1),tableX+17,y+3.8);pdf.text(sec(l.ms),tableX+28,y+3.8);const reason=({quality:lang==='sv'?'Kvalitet':'Quality',changeover:lang==='sv'?'Ställtid':'Changeover',machine:lang==='sv'?'Maskinfel':'Machine fault',other:lang==='sv'?'Annat':'Other'})[l.reason]||'';const note=[reason,l.note].filter(Boolean).join(': ');pdf.text(note||'-',tableX+48,y+3.8,{maxWidth:tableW-50});pdf.setDrawColor(235,239,245);pdf.line(tableX,y+rowH,tableX+tableW,y+rowH);});
  pdf.setFont('helvetica','normal');pdf.setFontSize(6.5);pdf.setTextColor(...muted);
  pdf.text((lang==='sv'?'Planerad körtid: ':'Planned runtime: ')+Math.floor(cap.plannedMinutes/60)+' h '+Math.round(cap.plannedMinutes%60)+' min · '+processData.startTime+'–'+processData.endTime+' · '+(lang==='sv'?'mix ':'mix ')+formatQty(cap.ppc),M,H-5);
  pdf.text(new Date().toLocaleString(lang==='sv'?'sv-SE':'en-GB'),W-M-35,H-5);
  const blob=pdf.output('blob');
  await shareOrDownloadFile(blob,`20-cycle-check-report-${new Date().toISOString().slice(0,10)}.pdf`,'application/pdf',true);
}

/* ===== Reset ===== */
function resetApp(){
  if(!confirm(lang==='sv'?'Är du säker på att du vill nollställa?':'Are you sure you want to reset?')) return;
  if(running){ cancelCurrentTimer(); }
  laps=[]; pendingCycle={note:'',pieces:1,reason:''}; selectedIndex=-1; processInput.value=''; subprocessInput.value=''; dateInput.value=new Date().toISOString().slice(0,10); standardInput.value=''; taktInput.value=''; productInput.value=''; boundaryInput.value=''; processData={shiftType:'1',startTime:'06:18',endTime:'14:42',plannedStopMinutes:0,setupsPerShift:0,setupMinutes:0,productsPerCycle:1};
  refreshUI();
}

/* ===== NEW: Kundtakt-uträkning (45 veckor/år) ===== */
function calcCustomerTaktInteractive(){openProcessModal();}

/* ===== Refresh UI ===== */
function refreshUI(){
  renderList();
  updateKPIs();
  updateCapacitySummary();
  drawChart();
  saveState();
}

/* ===== Init ===== */
function init(){
  loadState();
  if(!dateInput.value) dateInput.value=new Date().toISOString().slice(0,10);
  applyTheme();
  renderSubprocessOptions();
  setLangTexts();
  refreshUI();
  timerDisp.textContent='00:00.00';

  document.getElementById('btnLang').addEventListener('click', toggleLanguage);
  $('#btnProcessData').addEventListener('click',openProcessModal);$('#closeProcessModal').addEventListener('click',closeProcessModal);$('#cancelProcessData').addEventListener('click',closeProcessModal);$('#saveProcessData').addEventListener('click',saveProcessForm);$('#processModal').addEventListener('click',e=>{if(e.target.id==='processModal')closeProcessModal()});['productsPerCycle','startTime','endTime','plannedStopMinutes','setupsPerShift','setupMinutes'].forEach(id=>$('#'+id).addEventListener('input',updateProcessPreview));$('#shiftType').addEventListener('change',applyShiftDefaults);
  document.getElementById('btnExport').addEventListener('click', exportXLSX);
  document.getElementById('btnReport').addEventListener('click', exportReportModern);
  document.getElementById('btnReset').addEventListener('click', resetApp);
  processInput.addEventListener('input', saveState);
  subprocessInput.addEventListener('input', saveState);
  subprocessInput.addEventListener('change', rememberSubprocess);
  dateInput.addEventListener('input', saveState);
  productInput.addEventListener('input', saveState);
  boundaryInput.addEventListener('input', saveState);
  standardInput.addEventListener('input',()=>{saveState();renderList();drawChart();});
  taktInput.addEventListener('input', ()=>{ saveState(); renderList(); drawChart(); });
  document.getElementById('btnCalcTakt').addEventListener('click',calcCustomerTaktInteractive);
  window.addEventListener('resize', ()=>{ renderList(); drawChart(); });

  drawChart();
}
document.addEventListener('DOMContentLoaded', init);
window.addEventListener('beforeunload',e=>{ if(running){ e.preventDefault(); e.returnValue=''; } });
</script>
